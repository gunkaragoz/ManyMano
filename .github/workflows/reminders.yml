# Day-before reminder emails (GET /api/reminders).
#
# Cloudflare Pages has no native cron trigger, so this workflow calls the
# secured endpoint once a day. The endpoint fans out, for every sign-up
# sheet dated tomorrow and every finalized meeting locked in for tomorrow:
#   1. the organizer a roster summary (per-task fill like "1/3 volunteers"),
#   2. each participant with an email address a reminder for their own
#      shift(s) / the locked-in meeting time.
#
# Setup (one time):
#   1. Generate a secret:  openssl rand -hex 32
#   2. Pages dashboard → your project → Settings → Environment variables
#      (Production): add REMINDER_SECRET=<that value>.
#   3. GitHub repo → Settings → Secrets and variables → Actions → New
#      repository secret:
#        REMINDER_SECRET  = <same value>
#        REMINDERS_URL    = https://your-domain.com/api/reminders
#   4. Apply the D1 migration (reminder_sends table):
#        pnpm run db:migrate:remote
#
# The endpoint dedupes per event+date, so overlapping/retried runs never
# double-email. Append ?dry-run=1 to REMINDERS_URL to test without sending.

name: Day-before reminders

permissions:
  contents: read

on:
  schedule:
    # 06:00 UTC daily — organizers and participants get the reminder during
    # the day before, in every timezone from UTC-12 to UTC+14.
    - cron: "0 6 * * *"
  workflow_dispatch:

jobs:
  send-reminders:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger reminder endpoint
        run: |
          http_code=$(curl -s -o /tmp/reminders.json -w "%{http_code}" \
            --max-time 240 \
            -H "Authorization: Bearer $REMINDER_SECRET" \
            "$REMINDERS_URL")
          cat /tmp/reminders.json
          if [ "$http_code" -ge 400 ]; then
            echo "Reminder endpoint failed with HTTP $http_code"
            exit 1
          fi
        env:
          REMINDER_SECRET: ${{ secrets.REMINDER_SECRET }}
          REMINDERS_URL: ${{ secrets.REMINDERS_URL }}
